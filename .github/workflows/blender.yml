name: Build Blender Extension

on:
  push:
    tags:
    - '*' # Push events to matching v*, i.e. v1.0, v20.15.10

jobs:
  build:
    name: Build Blender Extension
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Blender
      run: | 
        wget https://download.blender.org/release/Blender4.5/blender-4.5.0-linux-x64.tar.xz -O blender.tar.xz
        mkdir blender
        tar -xvf blender.tar.xz -C blender --strip-components=1
    - name: Move files
      run: |
        mkdir extension
        cp blender_manifest.toml extension/
        # Read the shipped file list from the manifest rather than repeating
        # it here - a module missing from the zip only fails at enable time.
        cp $(python3 -c "import tomllib;print(' '.join(tomllib.load(open('blender_manifest.toml','rb'))['build']['paths']))") extension/
        
    - name: Build Blender Extension
      run: cd extension && ../blender/blender --command extension build

    - name: Move zip file
      run: |
        mkdir build_output
        # The archive is named "<id>-<version>.zip" from the manifest, so it
        # must never be hardcoded here - renaming the extension would break
        # the release with the build itself reporting success.
        mv extension/*.zip build_output/
        ls -l build_output/

    - name: Archive Build
      uses: actions/upload-artifact@v4
      with: 
        name: blender-extension-build
        path: build_output/

    - name: Create Release
      uses: ncipollo/release-action@v1
      with:
        artifacts: "build_output/*.zip"
        bodyFile: "release.md"
        allowUpdates: true
        omitBodyDuringUpdate: true



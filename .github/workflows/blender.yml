name: Build Blender Extension

on:
  push:
    tags:
    - '*' # Push events to matching v*, i.e. v1.0, v20.15.10

jobs:
  build:
    name: Build Blender Extension
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Blender
      run: |
        wget -q https://download.blender.org/release/Blender4.5/blender-4.5.0-linux-x64.tar.xz -O blender.tar.xz
        mkdir blender
        tar -xf blender.tar.xz -C blender --strip-components=1

    - name: Build Blender Extension
      # The package contents are the "[build] paths" allowlist in
      # blender_manifest.toml. Building from the checkout with Blender's own
      # tool means only those files are archived - tests, docs, lint config,
      # workflows and caches never make it into the zip.
      run: |
        mkdir build_output
        ./blender/blender --command extension build \
          --source-dir . \
          --output-dir build_output \
          --verbose
        ls -l build_output/

    - name: Verify package contents
      # Fail the release if the zip contains anything beyond the manifest
      # allowlist. This is what the extensions platform reviewers check.
      run: python3 .github/verify_package.py build_output/*.zip

    - name: Archive Build
      uses: actions/upload-artifact@v4
      with:
        name: blender-extension-build
        path: build_output/

    - name: Create Release
      uses: ncipollo/release-action@v1
      with:
        artifacts: "build_output/*.zip"
        bodyFile: "release.md"
        allowUpdates: true
        omitBodyDuringUpdate: true
